description: "Code review, testing lens (Rust). Single-lens member for an agent_run fan-out. Two project-specific traps to hunt: a test pinned to the very data its model was fit to (the calibration-set tautology, which once hid a 5x error) and process-global state leaking between tests. An IR promotion needs its invariants written red-before-green on a REAL corpus — equivalent spellings converge AND genuinely different code stays distinct."
