name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Release gate (mirrors ctxloom): every change to main must carry a fresh,
  # untagged VERSION, and Cargo.toml must agree with it so `reprise --version`
  # matches the tag. Fails the PR/push if v$VERSION is already tagged, forcing a
  # deliberate `just set-version <next>` bump. On merge, auto-release.yml tags
  # this VERSION and triggers the release.
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to check whether v$VERSION already exists
      - name: VERSION is fresh and matches Cargo.toml
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$V" ]; then
            echo "::error file=VERSION::VERSION file is empty"; exit 1
          fi
          CARGO_V="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          if [ "$V" != "$CARGO_V" ]; then
            echo "::error file=VERSION::VERSION ($V) != Cargo.toml version ($CARGO_V). Run 'just set-version $V' to sync them."
            exit 1
          fi
          TAG="v${V#v}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error file=VERSION::VERSION $V is already tagged ($TAG). Bump it ('just set-version <next>') before merging."
            exit 1
          fi
          echo "VERSION $V ($TAG) is fresh and matches Cargo.toml — OK to merge and release."

  test:
    name: lint + test + mutation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: extractions/setup-just@v2
      # Cache the cargo registry, git deps, and target/ across runs.
      - uses: Swatinem/rust-cache@v2
      - run: just lint
      - run: just test
      # ── Mutation-recall gate (spec §7.1) ──────────────────────────────
      # Recall regressions on the synthetic mutation benchmark fail the build.
      # This is the primary regression metric; keep it a distinct, visible step.
      - name: mutation-recall gate
        run: just bench-mutations

  release-smoke:
    name: release build + wild corpus + dogfood gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the dogfood drift gate diffs against a base ref
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release build
        run: cargo build --release
      # Wild-corpus recall net (DECISIONS.md D6/D31): verbatim real LLM-duplicated
      # fixtures must still converge at their labelled tiers on the release build.
      - name: wild-corpus recall
        run: cargo test --release --test wild
      # Smoke: the release binary scans its own repo without error (dogfood, spec §3).
      - name: scan smoke
        run: ./target/release/reprise scan .
      # Full dogfood: reprise gates its own changes. New/worsened duplication
      # (or an inconsistent update to a baselined group) fails this job.
      - name: dogfood drift gate (reprise check)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then BASE="origin/${{ github.base_ref }}"; else BASE="HEAD~1"; fi
          if ! git rev-parse -q --verify "$BASE" >/dev/null; then echo "no base ref to diff against; skipping"; exit 0; fi
          ./target/release/reprise check . --base "$BASE"
