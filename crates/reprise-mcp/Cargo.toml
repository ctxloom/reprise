[package]
name = "reprise-mcp"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Model Context Protocol server exposing reprise clone-detection to coding agents (docs/SERVERS.md §5)."
publish = false

[dependencies]
reprise = { path = "../.." }
reprise-server-core = { path = "../reprise-server-core" }
anyhow = "1.0.103"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
# Transport layer (src/main.rs). schemars comes via rmcp's re-export
# (`rmcp::schemars`) so the derived JsonSchema matches rmcp's expected version —
# no direct schemars dep, avoiding a two-schemars mismatch. The runtime stays
# confined to this crate; the reprise-integration core (src/lib.rs) is
# runtime-free and tested without a server.
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
