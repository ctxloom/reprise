[package]
name = "reprise"
version = "0.1.0"
edition = "2024"
description = "Semantic-ish code duplicate detection: normalizes with tree-sitter, fingerprints structurally, reports near-miss clones as anti-unification templates, and gates duplicate drift at PR time."
license = "BSD-3-Clause"
repository = "https://github.com/ctxloom/reprise"
homepage = "https://github.com/ctxloom/reprise"
readme = "README.md"
keywords = ["clone-detection", "duplicate-code", "tree-sitter", "code-quality", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]
# Keep the package to shippable crate contents. docs/PLAN.md stays IN (it is the
# authoritative spec). benches/ and examples/ are internal calibration corpora
# and debug probes; reprise-baseline.json / .reprise/ are dogfood state (D33).
exclude = [
    "benches/**",
    "examples/**",
    "reprise-baseline.json",
    ".reprise/**",
]

[dependencies]
anyhow = "1.0.103"
bincode = "1.3"
# interning-resolve-fix WP (session stark-mixed-front): backs the id-indexed `reverse`
# tables in `src/intern.rs` (`IdInterner`'s Kind/Field table, `LabelInterner`'s per-scan
# table). Resolution is id -> string, and ids are assigned densely from 0 by each
# table's own intern() (push index == id, asserted at push time) — a `DashMap<id,
# string>` was doing a hash + lock per resolve on the fingerprint-hashing hot path
# (`fingerprint.rs::push_label`, walked over ~every node during near-tier retrieval),
# which is exactly the class of regression this WP exists to kill. `boxcar::Vec` is a
# lock-free, append-only, indexable vec purpose-built for this shape: `push` never
# blocks a concurrent `get`, and `get(index)` is a direct indexed load, no hash, no
# lock. Not hand-rolled (this project's policy) and not `RwLock<Vec>` (a global read
# lock per node under rayon's parallel matching is the very contention being removed).
boxcar = "0.2.14"
clap = { version = "4.6.1", features = ["derive"] }
# Interning WP (session stark-mixed-front): backs the per-scan `LabelInterner`
# (src/intern.rs). A hand-rolled single `RwLock<HashMap<..>>` was measured to cause
# severe write-lock contention under rayon's parallel extraction at real corpus scale
# (~5-6x wall-clock slowdown on a real kernel subtree) — the label vocabulary is
# open-ended (repo-specific identifiers), unlike the small bounded kind/field table, so
# it never "saturates" the way that one does and stays write-hot for the whole scan.
# `dashmap` is already resolved in this workspace's dependency graph (pulled
# transitively via the MCP/LSP server crates), so this adds no new supply-chain
# surface — it is the standard, widely-used sharded-concurrent-map crate.
dashmap = "6.2"
globset = "0.4.18"
ignore = "0.4.27"
lru = "0.18.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tree-sitter = "0.26"
tree-sitter-c = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }

# The global allocator, on every target EXCEPT Windows (supersedes D42's musl-only
# mimalloc gate). Two independent, separately-measured reasons — see src/main.rs and
# DECISIONS.md D42:
#  1. musl (D42's, unchanged in kind): musl's default allocator is ~16x slower than
#     glibc under reprise's rayon-parallel scan.
#  2. glibc (dev/CI build): glibc malloc cannot give back the millions of small
#     `NormNode` chunks the memory gate frees mid-scan, so a later demand for large
#     contiguous Vecs is served by fresh mmap instead of the freed space — both
#     resident at once. jemalloc measured strictly better than mimalloc on both wall
#     and peak RSS (drivers/ and fs/), with no fs-scale regression, so it replaces
#     mimalloc everywhere it can, rather than just closing the musl-only gate.
# Windows is excluded, not by choice: tikv-jemalloc-sys does not build for
# x86_64-pc-windows-gnu (reprise's shipped Windows target) — "could not find native
# static library `jemalloc`" — mirroring long-unresolved upstream Windows gaps in
# jemalloc itself (MSVC is explicitly unsupported upstream; -gnu has an open,
# unmerged fix attempt). This is a hard build failure, not a judgment call; Windows
# keeps the system allocator, exactly as it did before this patch (no regression).
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.7"

# Opt-in instrumentation, OFF by default and never in a shipped build. Compiles the
# node-hash op counter in `src/fingerprint.rs` (`fingerprint::ops`) into a release
# binary, so the near tier's hashing cost can be counted on a real corpus scan. Wall
# time on the dev box drifts ±50% batch-to-batch (CLAUDE.md); this counter does not
# drift, which is why it — not a stopwatch — is the primary evidence for a hashing
# change. Unit tests get the same counter for free via `cfg(test)`.
[features]
hash-counter = []

# The root crate is also the workspace root. Server surfaces live in additive
# crates under crates/ (docs/SERVERS.md D-SRV-2) so the CLI's buildless,
# tokio-free, single-static-binary profile is untouched — `cargo build`
# (no --workspace) and `build-static` still build only the `reprise` binary.
[workspace]
resolver = "2"
members = ["crates/reprise-server-core", "crates/reprise-mcp", "crates/reprise-lsp"]
