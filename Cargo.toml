[package]
name = "reprise"
version = "0.1.0"
edition = "2024"
description = "Semantic-ish code duplicate detection: normalizes with tree-sitter, fingerprints structurally, reports near-miss clones as anti-unification templates, and gates duplicate drift at PR time."
license = "BSD-3-Clause"
repository = "https://github.com/ctxloom/reprise"
homepage = "https://github.com/ctxloom/reprise"
readme = "README.md"
keywords = ["clone-detection", "duplicate-code", "tree-sitter", "code-quality", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]
# Keep the package to shippable crate contents. docs/PLAN.md stays IN (it is the
# authoritative spec). benches/ and examples/ are internal calibration corpora
# and debug probes; reprise-baseline.json / .reprise/ are dogfood state (D33).
exclude = [
    "benches/**",
    "examples/**",
    "reprise-baseline.json",
    ".reprise/**",
]

[dependencies]
anyhow = "1.0.103"
bincode = "1.3"
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.18"
ignore = "0.4.27"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tree-sitter = "0.26"
tree-sitter-go = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }

# musl-only: the default musl allocator is ~16x slower than glibc under
# reprise's parallel scan (measured on the 500k perf corpus), which breaches the
# perf gate. mimalloc restores glibc-class speed. glibc/macOS use the system
# allocator (no dep, no change). See src/main.rs and DECISIONS.md D42.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

# The root crate is also the workspace root. Server surfaces live in additive
# crates under crates/ (docs/SERVERS.md D-SRV-2) so the CLI's buildless,
# tokio-free, single-static-binary profile is untouched — `cargo build`
# (no --workspace) and `build-static` still build only the `reprise` binary.
[workspace]
resolver = "2"
members = ["crates/reprise-server-core", "crates/reprise-mcp", "crates/reprise-lsp"]
